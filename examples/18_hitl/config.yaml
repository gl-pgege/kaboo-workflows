# 18_hitl — Human-in-the-loop: a delegated agent asks the person
#
#   review_team (delegate):
#     coordinator ─▶ field_agent (client_tools: [ask_user])
#
# `ask_user` is a browser tool: the client declares it and shows the question
# (kaboo-react's useAskUserTool). The asking agent runs inside a delegate, and
# its question still reaches the browser: the run ends with the call pending,
# and the browser's answer goes back to field_agent. The coordinator is told
# what was asked and answered.
#
# Run:
#   uv run python examples/18_hitl/main.py

models:
  default:
    provider: bedrock
    model_id: openai.gpt-oss-20b-1:0

x-hooks: &hooks
  - type: kaboo_workflows.hooks:MaxToolCallsGuard
    params: { max_calls: 20 }
  - type: kaboo_workflows.hooks:ToolNameSanitizer

agents:
  coordinator:
    model: default
    hooks: *hooks
    system_prompt: |
      You coordinate a review. Delegate the work to field_agent and return its
      result once it has confirmed the details with the user.

  field_agent:
    model: default
    hooks: *hooks
    client_tools: [ask_user]
    system_prompt: |
      You do gated field work. Before finalizing anything risky, call ask_user to
      confirm with the user. If several details are unclear, ask them together in
      one ask_user call (a multi-question form) rather than guessing. Only proceed
      once you have the user's answers.

orchestrations:
  review_team:
    mode: delegate
    entry_name: coordinator
    connections:
      - { agent: field_agent, description: "Does the gated field work with user confirmation" }

entry: review_team
