# step1 — Minimal Agent
#
# One agent, one tool, OpenRouter model.
# Requires OPENROUTER_API_KEY set in environment.
#
# Serve:
#   OPENROUTER_API_KEY=... kaboo-serve examples/step1/config.yaml
#
# REPL:
#   OPENROUTER_API_KEY=... uv run python examples/step1/main.py

vars:
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

models:
  default:
    provider: openai
    model_id: anthropic/claude-sonnet-4
    params:
      client_args:
        base_url: https://openrouter.ai/api/v1
        api_key: ${OPENROUTER_API_KEY}

agents:
  assistant:
    model: default
    system_prompt: |
      You are a helpful assistant.
      Use the calculator tool when asked math questions.
    tools:
      - ./tools/calculator_tool.py

entry: assistant
