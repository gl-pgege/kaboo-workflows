# Graph nested under a delegate:
#   coordinator ─▶ research_graph (graph: strategist → [writer, researcher] → editor)
x-model: &m tests.fakes.scripted_model:ScriptedModel

agents:
  coordinator:
    stream: {title: "Coordinating"}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: research_graph, input: "produce a report"}
        final_text: "Coordinator returned the graph's report."
  strategist:
    stream: {title: "Strategy"}
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "Outline ready."}
  writer:
    stream: {title: "Draft"}
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "Draft written."}
  researcher:
    stream: {title: "Data"}
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "Data gathered."}
  editor:
    stream: {title: "Editing"}
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "Edited final report."}

orchestrations:
  research_graph:
    mode: graph
    entry_name: strategist
    chat_output: editor
    edges:
      - {from: strategist, to: writer}
      - {from: strategist, to: researcher}
      - {from: writer, to: editor}
      - {from: researcher, to: editor}
  top:
    mode: delegate
    entry_name: coordinator
    connections:
      - {agent: research_graph, description: "Run the research graph"}

entry: top
