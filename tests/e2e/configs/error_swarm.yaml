# First-class swarm whose middle node fails — error must surface from a
# multi-agent run, not hang.
x-model: &m tests.fakes.scripted_model:ScriptedModel

agents:
  planner:
    stream: {title: "Planning"}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {handoff: researcher, message: "Gather the data."}
  researcher:
    stream: {title: "Researching"}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {error: "search backend unavailable"}
  writer:
    stream: {title: "Writing"}
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "unreached"}

orchestrations:
  pipeline:
    mode: swarm
    agents: [planner, researcher, writer]
    entry_name: planner
    chat_output: writer

entry: pipeline
