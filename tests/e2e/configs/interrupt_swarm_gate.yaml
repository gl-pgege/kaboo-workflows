# TOOL-GATE interrupt (interrupt.tools) on a SWARM node. Calling the gated
# tool pauses the whole run BEFORE the tool executes; an approve-with-edits
# resume executes it with the edited arguments, the handoff proceeds and the
# writer's text is the chat reply.
x-model: &m tests.fakes.scripted_model:ScriptedModel

agents:
  planner:
    stream: {title: "Planning"}
    tools: ["tests.fakes.gated_tools:submit_report"]
    interrupt:
      tools: [submit_report]
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: submit_report, input: {title: "Q3 draft"}}
          - {handoff: writer, message: "Write it up."}
  writer:
    stream: {title: "Writing"}
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "Final swarm report after the gated write."}

orchestrations:
  pipeline:
    mode: swarm
    agents: [planner, writer]
    entry_name: planner
    chat_output: writer

entry: pipeline
