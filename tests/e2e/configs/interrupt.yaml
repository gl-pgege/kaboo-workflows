# HITL interrupt inside a delegate: the coordinator delegates to `worker`, whose
# call waits for the person's approval and pauses the whole run. On resume the
# worker receives the answer and finishes, and the coordinator wraps up.
x-model: &m kaboo_workflows.testing:ScriptedModel

agents:
  coordinator:
    stream: {title: "Coordinating"}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: worker, input: "handle it"}
        final_text: "Coordinator wrapped up after approval."
  worker:
    stream: {title: "Working"}
    tools: ["tests.fakes.gated_tools:submit_report"]
    interrupt: {tools: [submit_report]}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: submit_report, input: {title: "Q3 draft"}}
        final_text: "Worker finished after approval."

orchestrations:
  team:
    mode: delegate
    entry_name: coordinator
    connections:
      - {agent: worker, description: "Does the gated work"}

entry: team
