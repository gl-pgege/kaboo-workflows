# HITL interrupt on a first-class GRAPH node. The strategist's call waits for
# the person's approval, pausing the run; on resume the graph proceeds along its
# edge to the editor, whose text is the chat reply.
x-model: &m kaboo_workflows.testing:ScriptedModel

agents:
  strategist:
    stream: {title: "Strategy"}
    tools: ["tests.fakes.gated_tools:submit_report"]
    interrupt: {tools: [submit_report]}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: submit_report, input: {title: "Scope"}}
        final_text: "Outline ready."
  editor:
    stream: {title: "Editing"}
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "Final graph report after approval."}

orchestrations:
  pipeline:
    mode: graph
    entry_name: strategist
    chat_output: editor
    edges:
      - {from: strategist, to: editor}

entry: pipeline
