# A worker two delegations down asks the person; the lead and the coordinator
# pass its question up and the answer back down.
x-model: &m kaboo_workflows.testing:ScriptedModel

agents:
  coordinator:
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: research, input: "find the region"}
        final_text: "Coordinator done."
  lead:
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: worker, input: "find the region"}
        final_text: "Lead done."
  worker:
    client_tools: [ask_user]
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: ask_user, input: {questions: [{question: "Which region?", options: ["Europe", "APAC"]}]}}
        final_text: "Worker used the answer."

orchestrations:
  research:
    mode: delegate
    entry_name: lead
    connections:
      - {agent: worker, description: "Finds things out"}
  team:
    mode: delegate
    entry_name: coordinator
    connections:
      - {agent: research, description: "Researches"}

entry: team
