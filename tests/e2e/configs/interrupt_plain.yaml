# HITL interrupt on a PLAIN ENTRY agent. The entry agent's call waits for the
# person's approval, pausing the run; on resume it continues to its answer.
# Requires the entry node's hook providers to be forwarded to the per-thread
# clone ag-ui-strands executes (see create_agui_app / get_agent_hook_providers).
agents:
  assistant:
    stream: {title: "Assistant"}
    tools: ["tests.fakes.gated_tools:submit_report"]
    interrupt: {tools: [submit_report]}
    model:
      provider: kaboo_workflows.testing:ScriptedModel
      model_id: scripted
      params:
        script:
          - {tool: submit_report, input: {title: "Q3 draft"}}
        final_text: "Proceeding after approval."

entry: assistant
