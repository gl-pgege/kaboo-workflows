# A masked memory with a summary backstop. Once the written-back memory passes
# summarize_over, its oldest calls fold into one summary written by `summarizer`.
x-model: &m tests.fakes.scripted_model:ScriptedModel

models:
  summarizer:
    provider: *m
    model_id: scripted
    params: {final_text: "Earlier, queries q-1 and q-2 found $42M of revenue."}

agents:
  coordinator:
    stream: {title: "Coordinating"}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: analyst, input: "and by region?"}
        final_text: "Coordinator done."
  analyst:
    stream: {title: "Analysis"}
    history:
      group: sql
      keep: masked
      summarize_over: 300
      summarize_model: summarizer
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "By region it is ready."}

orchestrations:
  team:
    mode: delegate
    entry_name: coordinator
    connections:
      - {agent: analyst, description: "Answers questions with SQL"}

entry: team
