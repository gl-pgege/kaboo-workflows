# Swarm nested under a delegate:
#   coordinator ─▶ research_swarm (swarm: planner → researcher → writer)
x-model: &m tests.fakes.scripted_model:ScriptedModel

agents:
  coordinator:
    stream: {title: "Coordinating"}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: research_swarm, input: "research the market"}
        final_text: "Coordinator returned the swarm's report."
  planner:
    stream: {title: "Planning"}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {handoff: researcher, message: "Gather the data."}
  researcher:
    stream: {title: "Researching"}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {handoff: writer, message: "Write it up."}
  writer:
    stream: {title: "Writing"}
    model:
      provider: *m
      model_id: scripted
      params:
        final_text: "Swarm report body."

orchestrations:
  research_swarm:
    mode: swarm
    agents: [planner, researcher, writer]
    entry_name: planner
  top:
    mode: delegate
    entry_name: coordinator
    connections:
      - {agent: research_swarm, description: "Run the research swarm"}

entry: top
