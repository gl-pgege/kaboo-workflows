# HITL interrupt on a first-class SWARM node. The planner's call waits for the
# person's approval mid-swarm, pausing the whole run; on resume it hands off to
# the writer, whose text is the chat reply.
x-model: &m kaboo_workflows.testing:ScriptedModel

agents:
  planner:
    stream: {title: "Planning"}
    tools: ["tests.fakes.gated_tools:submit_report"]
    interrupt: {tools: [submit_report]}
    model:
      provider: *m
      model_id: scripted
      params:
        script:
          - {tool: submit_report, input: {title: "Market focus"}}
          - {handoff: writer, message: "Write it up."}
  writer:
    stream: {title: "Writing"}
    model:
      provider: *m
      model_id: scripted
      params: {final_text: "Final swarm report after approval."}

orchestrations:
  pipeline:
    mode: swarm
    agents: [planner, writer]
    entry_name: planner
    chat_output: writer

entry: pipeline
