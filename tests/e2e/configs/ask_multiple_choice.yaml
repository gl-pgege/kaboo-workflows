agents:
  assistant:
    stream: {title: "Assistant"}
    interrupt: true
    model:
      provider: kaboo_workflows.testing:ScriptedModel
      model_id: scripted
      params:
        script:
          - {tool: ask_user, input: {question: "Which market should I focus on?"}}
          - {tool: ask_user, input: {question: "Which market should I focus on?", options: ["AI", "Cloud"]}}
        final_text: "Focusing on the market you chose."

entry: assistant
